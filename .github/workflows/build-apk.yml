name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Pastikan paket Android SDK yang dibutuhkan tersedia
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependensi Capacitor
        working-directory: apk-wrapper
        run: npm install

      - name: Salin index.html terbaru ke www
        run: |
          mkdir -p apk-wrapper/www
          cp index.html apk-wrapper/www/index.html

      - name: Tambah & sinkron platform Android
        working-directory: apk-wrapper
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Tulis local.properties (pastikan Gradle menemukan SDK)
        working-directory: apk-wrapper
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Patch izin getaran & cleartext
        working-directory: apk-wrapper
        run: |
          sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Patch MainActivity (izinkan autoplay video bersuara)
        working-directory: apk-wrapper
        run: |
          mkdir -p android/app/src/main/java/com/nexabuild/app
          cat > android/app/src/main/java/com/nexabuild/app/MainActivity.java << 'EOF'
          package com.nexabuild.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  this.bridge.getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
              }
          }
          EOF

      - name: Build APK debug
        working-directory: apk-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nexabuild-debug-apk
          path: apk-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
